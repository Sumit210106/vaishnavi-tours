<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Taxi Service Feedback</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap');

        body {
            margin: 0;
            padding: 0;
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(to bottom right, #1e1e1e, #343434);
            color: white;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .container {
            width: 80%;
            max-width: 900px;
            background: #222;
            padding: 40px;
            border-radius: 15px;
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.7);
            animation: fadeIn 1.5s ease-in-out;
        }

        h1 {
            font-size: 2.5rem;
            text-align: center;
            color: #f1c40f;
            margin-bottom: 20px;
        }

        label {
            font-size: 1.1rem;
            display: block;
            margin-top: 15px;
            color: #f7f7f7;
        }

        input, select, textarea {
            width: 100%;
            padding: 12px;
            margin-top: 8px;
            border: none;
            border-radius: 8px;
            background: #333;
            color: white;
            font-size: 1rem;
            outline: none;
        }

        textarea {
            resize: none;
        }

        button {
            display: block;
            width: 100%;
            margin-top: 20px;
            padding: 12px;
            background: #f1c40f;
            color: #222;
            font-weight: bold;
            font-size: 1.2rem;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        button:hover {
            background: #e67e22;
            color: white;
            transform: scale(1.05);
        }

        .stars {
            display: flex;

            justify-content: space-evenly;text-align: center;
            margin: 10px ;
            padding-left: 100px;
            flex-direction: row-reverse;


            justify-content: space-between;
            margin-top: 8px;

        }

        .stars input {
            display: none;
        }

        .stars label {
            font-size: 2rem;
            color: #444;
            cursor: pointer;
            transition: color 0.3s, transform 0.2s;
        }

        .stars input:checked ~ label,
        .stars label:hover,
        .stars label:hover ~ label {
            color: #f1c40f;
            transform: scale(1.2);
        }

        .add-feedback {
            text-align: center;
            margin-top: 20px;
        }

        .add-feedback button {
            background: #222;
            color: #f1c40f;
            border: 2px solid #f1c40f;
            font-size: 1rem;
            width: auto;
            padding: 8px 16px;
            transition: all 0.3s;
        }

        .add-feedback button:hover {
            background: #f1c40f;
            color: #222;
        }

        .feedback-section {
            margin-top: 20px;
            padding: 20px;
            background: #333;
            border-radius: 8px;
        }

        .remove-section {
            background: #e74c3c;
            color: white;
            cursor: pointer;
            padding: 10px 15px;
            border: none;
            border-radius: 8px;
            margin-top: 15px;
            transition: background 0.3s;
        }

        .remove-section:hover {
            background: #c0392b;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
    </style>
    <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/@emailjs/browser@3/dist/email.min.js"></script>
</head>
<body>
    <div class="container">
        <h1>Taxi Service Feedback</h1>
        <form id="feedbackForm">
            <label for="name">Your Name:</label>
            <input type="text" id="name" name="name" placeholder="Enter your name" required>

            <label for="email">Your Email:</label>
            <input type="email" id="email" name="email" placeholder="Enter your email" required>

            <label for="contact">Contact Number:</label>
            <input type="tel" id="contact" name="contact" placeholder="Enter your contact number">

            <label for="vehicleNumber">Vehicle Number:</label>
            <input type="text" id="vehicleNumber" name="vehicleNumber" placeholder="Enter vehicle number">

            <label for="feedbackType">Feedback Type:</label>
            <select id="feedbackType" name="feedbackType" required>
                <option value="Driver">Driver</option>
                <option value="Vehicle">Vehicle</option>
                <option value="Journey">Journey</option>
            </select>

            <label for="rating">Service Rating:</label>
            <div class="stars">
                <input type="radio" id="star5" name="rating" value="5">
                <label for="star5">&#9733;</label>
                <input type="radio" id="star4" name="rating" value="4">
                <label for="star4">&#9733;</label>
                <input type="radio" id="star3" name="rating" value="3">
                <label for="star3">&#9733;</label>
                <input type="radio" id="star2" name="rating" value="2">
                <label for="star2">&#9733;</label>
                <input type="radio" id="star1" name="rating" value="1">
                <label for="star1">&#9733;</label>
            </div>

            <label for="comments">Your Feedback:</label>
            <textarea id="comments" name="comments" rows="4" placeholder="Write your feedback here..." required></textarea>

            <div class="add-feedback">
                <span>Want to add feedback for more than one category?</span>
                <button type="button" id="addMore">Add Feedback</button>
            </div>

            <button type="submit">Submit Feedback</button>
        </form>
    </div>

    <script>
        document.getElementById('addMore').addEventListener('click', function() {
            const newSection = document.createElement('div');
            newSection.classList.add('feedback-section');

            const feedbackTypeLabel = document.createElement('label');
            feedbackTypeLabel.innerHTML = 'Feedback Type:';
            const feedbackTypeSelect = document.createElement('select');
            feedbackTypeSelect.name = 'feedbackType';
            feedbackTypeSelect.innerHTML = `
                <option value="Driver">Driver</option>
                <option value="Vehicle">Vehicle</option>
                <option value="Journey">Journey</option>
            `;
            newSection.appendChild(feedbackTypeLabel);
            newSection.appendChild(feedbackTypeSelect);

            const ratingLabel = document.createElement('label');
            ratingLabel.innerHTML = 'Service Rating:';
            const starsDiv = document.createElement('div');
            starsDiv.classList.add('stars');
            for (let i = 5; i >= 1; i--) {
                const input = document.createElement('input');
                input.type = 'radio';
                input.id = `star${i}_new`;
                input.name = `rating_new_${i}`;
                input.value = i;
                const label = document.createElement('label');
                label.setAttribute('for', `star${i}_new`);
                label.innerHTML = '&#9733;';
                starsDiv.appendChild(input);
                starsDiv.appendChild(label);
            }
            newSection.appendChild(ratingLabel);
            newSection.appendChild(starsDiv);

            const commentsLabel = document.createElement('label');
            commentsLabel.innerHTML = 'Your Feedback:';
            const commentsTextarea = document.createElement('textarea');
            commentsTextarea.name = 'comments';
            commentsTextarea.rows = 4;
            commentsTextarea.placeholder = 'Write your feedback here...';
            newSection.appendChild(commentsLabel);
            newSection.appendChild(commentsTextarea);

            const removeButton = document.createElement('button');
            removeButton.classList.add('remove-section');
            removeButton.innerHTML = 'Remove this Feedback';
            removeButton.addEventListener('click', function() {
                newSection.remove();
            });
            newSection.appendChild(removeButton);

            document.querySelector('form').appendChild(newSection);
        });
    </script>
     <script>
        
        emailjs.init('-KAL8dhf9nwGDKtZQ'); // Replace with your EmailJS public key
    document.getElementById('feedbackForm').addEventListener('submit', function (e) {
        e.preventDefault();
        // Initialize EmailJS
        const serviceID = 'service_yqjy5gk'; // Replace with your Service ID
        const templateID = 'template_5evkann'; // Replace with your Template ID
        const formData = {
            name: document.getElementById('name').value,
            email: document.getElementById('email').value,
            contact: document.getElementById('contact').value,
            vehicleNumber: document.getElementById('vehicleNumber').value,
            feedbackType: document.getElementById('feedbackType').value,
            rating: document.querySelector('input[name="rating"]:checked')?.value || 'No Rating',
            comments: document.getElementById('comments').value,
        };
        console.log('Sending data to EmailJS:', formData);
        emailjs.send(serviceID, templateID, formData)
            .then(() => {
                alert('Feedback sent successfully!');
                document.getElementById('feedbackForm').reset();
            })
            .catch((error) => {
                console.error('Error sending feedback:', error);
                alert(`Failed to send feedback. Error: ${error.text || error}`);
            });
    });
</script>
</body>
</html>
