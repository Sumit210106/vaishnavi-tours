<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Taxi Service Feedback</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: 'Roboto', sans-serif;
            background: linear-gradient(to bottom right, rgba(0, 0, 0, 0.8), rgba(0, 0, 0, 0.6)), 
                        url('https://source.unsplash.com/1920x1080/?taxi,city') no-repeat center center/cover;
            color: white;
            height: 100vh;
            overflow-x: hidden;
        }

        .container {
            width: 70%;
            margin: 50px auto;
            padding: 50px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 15px;
            backdrop-filter: blur(12px);
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.7);
            animation: fadeIn 1.5s ease-in-out;
        }

        h1 {
            text-align: center;
            font-size: 3rem;
            margin-bottom: 20px;
            color: #f39c12;
        }

        label {
            font-size: 1.2rem;
            display: block;
            margin-top: 15px;
        }

        input, select, textarea, button {
            width: 100%;
            padding: 12px;
            margin: 10px 0;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
        }

        input, select, textarea {
            background: rgba(255, 255, 255, 0.2);
            color: white;
            outline: none;
        }

        button {
            background: #e67e22;
            color: white;
            font-weight: bold;
            cursor: pointer;
            transition: transform 0.3s, background 0.3s;
        }

        button:hover {
            background: #d35400;
            transform: scale(1.05);
        }

        .stars {
            display: flex;
            justify-content: center;
            margin: 10px 0;
        }

        .stars input {
            display: none;
        }

        .stars label {
            font-size: 2.5rem;
            color: rgba(255, 255, 255, 0.5);
            cursor: pointer;
            margin: 0 5px;
            transition: color 0.3s ease-in-out, transform 0.2s;
        }

        .stars input:checked ~ label,
        .stars label:hover,
        .stars label:hover ~ label {
            color: #f1c40f;
            transform: scale(1.2);
        }

        .add-feedback {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin: 20px 0;
        }
        textarea::placeholder {
            color: whitesmoke;
        }

        .add-feedback button {
            width: auto;
            padding: 10px 20px;
            font-size: 1rem;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(50px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Taxi Service Feedback</h1>
        <form id="feedbackForm">
            <label for="name">Your Name:</label>
            <input type="text" id="name" name="name" placeholder="Enter your name" required>
            
            <label for="email">Your Email *:</label>
            <input type="email" id="email" name="email" placeholder="Enter your email" required>
            
            <label for="contact">Contact Number:</label>
            <input type="tel" id="contact" name="contact" placeholder="Enter your contact number" >

            <label for="vehicleNumber">Vehicle Number:</label>
            <input type="text" id="vehicleNumber" name="vehicleNumber" placeholder="Enter vehicle number">

            <label for="feedbackType">Feedback Type:</label>
            <select id="feedbackType" name="feedbackType" required>
                <option value="Driver">Driver</option>
                <option value="Vehicle">Vehicle</option>
                <option value="Journey">Journey</option>
            </select>
            
            <label for="rating">Service Rating:</label>
            <div class="stars">
                <input type="radio" id="star5" name="rating" value="5" >
                <label for="star5">&#9733;</label>
                <input type="radio" id="star4" name="rating" value="4">
                <label for="star4">&#9733;</label>
                <input type="radio" id="star3" name="rating" value="3">
                <label for="star3">&#9733;</label>
                <input type="radio" id="star2" name="rating" value="2">
                <label for="star2">&#9733;</label>
                <input type="radio" id="star1" name="rating" value="1">
                <label for="star1">&#9733;</label>
            </div>

            <label for="comments">Your Feedback:</label>
            <textarea id="comments" name="comments" rows="4" placeholder="Write your feedback here..." required style="color: whitesmoke;"></textarea>

            <div class="add-feedback">
                <span>Want to add feedback for more than one category?</span>
                <button type="button" id="addMore">+</button>
            </div>

            <button type="submit">Submit Feedback</button>
        </form>
    </div>

    <script>
        
    </script>
</body>
</html>
