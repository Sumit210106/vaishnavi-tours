
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Taxi Service Feedback</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: 'Roboto', sans-serif;
            background: linear-gradient(to bottom right, rgba(0, 0, 0, 0.8), rgba(0, 0, 0, 0.6)), 
                        url('') no-repeat center center/cover;
            color: white;
            height: 100vh;
            overflow-x: hidden;
        }

        .container {
            width: 70%;
            margin: 50px auto;
            padding: 60px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 15px;
            backdrop-filter: blur(12px);
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.7);
            animation: fadeIn 1.5s ease-in-out;
            text-align: center;
        }

        h1 {
            text-align: center;
            font-size: 3rem;
            margin-bottom: 20px;
            color: #f39c12;
        }

        label {
            font-size: 1.2rem;
            display: block;
            margin-top: 15px;
            width: 90%;
            text-align: left;
        }

        input, select, textarea, button {
            width: 90%;
            padding: 12px;
            margin: 10px 0;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
        }

        input, select, textarea {
            background: rgba(255, 255, 255, 0.2);
            color: white;
            outline: none;
        }

        button {
            background: #e67e22;
            color: white;
            font-weight: bold;
            cursor: pointer;
            transition: transform 0.3s, background 0.3s;
        }

        button:hover {
            background: #d35400;
            transform: scale(1.05);
        }
        .stars {
            display: flex;
            justify-content: space-evenly;text-align: center;
            margin: 10px ;
            padding-left: 100px;
            flex-direction: row-reverse;

        }

        .stars input {
            display: none;
        }

        .stars label {
            font-size: 2rem;
            color: rgba(255, 255, 255, 0.5);
            cursor: pointer;
            margin: 5px;
            transition: color 0.3s ease-out-in, transform 0.2s;
        }

        .stars input:checked ~ label,
        .stars label:hover,
        .stars label:hover ~ label {
            color: #f1c40f;
            transform: scale(1.2);
        }




        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(50px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .feedback-section {
            margin-top: 20px;
            padding: 20px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 8px;
            backdrop-filter: blur(12px);
        }
        
        .remove-section {
            background: #ff9532;
            color: white;
            cursor: pointer;
            padding: 5px 10px;
            border-radius: 5px;
            transition: background 0.3s ease-in-out;
        }

        .remove-section:hover {
            background: #e74c3c;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Taxi Service Feedback</h1>
        <form id="feedbackForm">
            <label for="name">Your Name:</label>
            <input type="text" id="name" name="name" placeholder="Enter your name" required>
            
            <label for="email">Your Email:</label>
            <input type="email" id="email" name="email" placeholder="Enter your email" required>
            
            <label for="contact">Contact Number:</label>
            <input type="tel" id="contact" name="contact" placeholder="Enter your contact number">

            <label for="vehicleNumber">Vehicle Number:</label>
            <input type="text" id="vehicleNumber" name="vehicleNumber" placeholder="Enter vehicle number">

            <label for="feedbackType">Feedback Type:</label>
            <select id="feedbackType" name="feedbackType" required>
                <option value="Driver">Driver</option>
                <option value="Vehicle">Vehicle</option>
                <option value="Journey">Journey</option>
            </select>
            
            <label for="rating">Service Rating:</label>
            <div class="stars">
                <input type="radio" id="star5" name="rating" value="5">
                <label for="star5">&#9733;</label>

                <input type="radio" id="star4" name="rating" value="4">
                <label for="star4">&#9733;</label>

                <input type="radio" id="star3" name="rating" value="3">
                <label for="star3">&#9733;</label>

                <input type="radio" id="star2" name="rating" value="2">
                <label for="star2">&#9733;</label>

                <input type="radio" id="star1" name="rating" value="1">
                <label for="star1">&#9733;</label>
            </div>

            <label for="comments">Your Feedback:</label>
            <textarea id="comments" name="comments" rows="4" placeholder="Write your feedback here..." required></textarea>

            <div class="add-feedback">
                <span>Want to add feedback for more than one category?</span>
                <button type="button" id="addMore">+</button>
            </div>

            <button type="submit">Submit Feedback</button>
        </form>

        
    </div>

    <script>
        document.getElementById('addMore').addEventListener('click', function() {
            // Create new feedback section
            const newSection = document.createElement('div');
            newSection.classList.add('feedback-section');
            
            // Add Feedback Type dropdown
            const feedbackTypeLabel = document.createElement('label');
            feedbackTypeLabel.innerHTML = 'Feedback Type:';
            const feedbackTypeSelect = document.createElement('select');
            feedbackTypeSelect.name = 'feedbackType';
            feedbackTypeSelect.innerHTML = `
                <option value="Driver">Driver</option>
                <option value="Vehicle">Vehicle</option>
                <option value="Journey">Journey</option>
            `;
            newSection.appendChild(feedbackTypeLabel);
            newSection.appendChild(feedbackTypeSelect);

            // Add Rating stars
            const ratingLabel = document.createElement('label');
            ratingLabel.innerHTML = 'Service Rating:';
            const starsDiv = document.createElement('div');
            starsDiv.classList.add('stars');
            for (let i = 5; i >= 1; i--) {
                const input = document.createElement('input');
                input.type = 'radio';
                input.id = `star${i}_new`;
                input.name = `rating_new_${i}`;
                input.value = i;
                const label = document.createElement('label');
                label.setAttribute('for', `star${i}_new`);
                label.innerHTML = '&#9733;';
                starsDiv.appendChild(input);
                starsDiv.appendChild(label);
            }
            newSection.appendChild(ratingLabel);
            newSection.appendChild(starsDiv);

            // Add comments field
            const commentsLabel = document.createElement('label');
            commentsLabel.innerHTML = 'Your Feedback:';
            const commentsTextarea = document.createElement('textarea');
            commentsTextarea.name = 'comments';
            commentsTextarea.rows = 4;
            commentsTextarea.placeholder = 'Write your feedback here...';
            newSection.appendChild(commentsLabel);
            newSection.appendChild(commentsTextarea);

            // Add remove section button
            const removeButton = document.createElement('button');
            removeButton.classList.add('remove-section');
            removeButton.innerHTML = 'Remove this Feedback';
            removeButton.addEventListener('click', function() {
                newSection.remove();
            });
            newSection.appendChild(removeButton);

            // Add new section to the form
            document.querySelector('form').appendChild(newSection);
        });
    </script>
    
</body>
</html>
