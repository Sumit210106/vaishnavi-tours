<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        /* Global styles */
        body {
            font-family: 'Arial', sans-serif;
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        footer {
            background-color: #2c2c2c;
            color: #fff;
            padding: 60px 20px;
            box-shadow: 0px 4px 6px rgba(0, 0, 0, 0.2), 0px 0px 12px rgba(0, 0, 0, 0.3);
            position: relative;
        }

        footer::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-image: linear-gradient(45deg, rgba(0, 0, 0, 0.1), rgba(0, 0, 0, 0.3));
            z-index: -1;
            opacity: 0.5;
        }

        footer .container {
            max-width: 1200px;
            margin: 0 auto;
            display: flex;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 20px;
        }

        footer .col-md-4 {
            flex: 1;
            padding: 0 15px;
            min-width: 250px;
        }

        footer h1, footer h2, footer h3 {
            font-size: 1.8em;
            margin-bottom: 20px;
            font-weight: bold;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.5);
        }

        footer h1 {
            font-size: 2.5em;
            margin-top: 10px;
            color: #f0a500;
        }

        footer ul {
            list-style: none;
            padding: 0;
        }

        footer ul li {
            padding: 10px 0;
            font-size: 1.1em;
        }

        footer ul li a {
            color: #fff;
            text-decoration: none;
            display: flex;
            align-items: center;
            transition: all 0.3s ease;
        }

        footer ul li a:hover {
            color: #f0a500;
            transform: translateY(-3px);
            text-decoration: underline;
        }

        footer ul li a img {
            margin-right: 10px;
            width: 20px;
            height: 20px;
            filter: drop-shadow(1px 1px 1px rgba(0, 0, 0, 0.3));
        }

        footer iframe {
            border: none;
            border-radius: 10px;
            width: 100%;
            height: 300px;
            margin-top: 20px;
            box-sizing: border-box;
            transition: all 0.3s ease;
        }

        footer iframe:hover {
            transform: scale(1.03);
        }

        footer button {
            background-color: #f0a500;
            color: #333;
            padding: 14px 28px;
            border: none;
            border-radius: 5px;
            font-size: 18px;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0px 4px 6px rgba(0, 0, 0, 0.3);
        }

        footer button:hover {
            background-color: #d48f00;
            transform: translateY(-3px);
            box-shadow: 0px 8px 10px rgba(0, 0, 0, 0.4);
        }

        /* Media queries */
        @media screen and (max-width: 768px) {
            footer .container {
                flex-direction: column;
                align-items: center;
                text-align: center;
            }

            footer .col-md-4 {
                width: 100%;
                margin-bottom: 30px;
                padding: 0 10px;
            }

            footer h1, footer h2 {
                font-size: 1.8em;
            }

            footer ul li a {
                font-size: 1.2em;
            }

            footer iframe {
                height: 250px;
            }

            footer button {
                width: 100%;
            }
        }
    </style>
</head>
<body>

    <footer>
        <div class="container">
            <!-- Column 1: Company Info -->
            <div class="col-md-4">
                <h2>THANK YOU FOR VISITING</h2>
                <h1>VAISHNAVI TOURS 🙏🏻</h1>
                <ul>
                    <li><a href="#">About Us</a></li>
                    <li><a href="#">Our Services</a></li>
                    <li><a href="#">Privacy Policy</a></li>
                </ul>
            </div>

            <!-- Column 2: Support -->
            <div class="col-md-4">
                <h3>Support</h3>
                <ul>
                    <li><a href="#">FAQ</a></li>
                    <li><a href="#">Contact Us</a></li>
                </ul>
            </div>

            <!-- Column 3: Social Links and Button -->
            <div class="col-md-4">
                <h3>Get in Touch</h3>
                <ul>
                    <li><a href="#"><img src="https://img.icons8.com/ios-filled/50/ffffff/blog.png" alt="Blog">Blog</a></li>
                    <li><a href="https://www.facebook.com/share/1Anpd6CaVt/"><img src="https://img.icons8.com/ios-filled/50/ffffff/facebook.png" alt="Facebook">Facebook</a></li>
                    <li><a href="https://youtube.com/@vaishnavitours.cg10?si=8WegEoIl5AZyP3Mq"><img src="https://img.icons8.com/ios-filled/50/ffffff/youtube.png" alt="YouTube">YouTube</a></li>
                    <li><a href="https://www.instagram.com/vaishnavitours.bilaspur?igsh=MTlqdzE0a3p0dzUxdw=="><img src="https://img.icons8.com/ios-filled/50/ffffff/instagram.png" alt="Instagram">Instagram</a></li>
                </ul>
                <div>
                    <button>Get A Call Back</button>
                </div>
            </div>

            <!-- Column 4: Location Map -->
            <div class="col-md-4">
                <h3>Our Location</h3>
                <iframe src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d3696.0148659060487!2d82.10498319999999!3d22.1254089!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x3a280c3de677d119%3A0x1cee39b29c05e6d4!2sB.N.City%20Bilaspur!5e0!3m2!1sen!2sin!4v1735407831521!5m2!1sen!2sin" allowfullscreen="" loading="lazy" referrerpolicy="no-referrer-when-downgrade"></iframe>
            </div>
        </div>
    </footer>

</body>
</html>
