        footer ul li a:hover {

        footer ul li a img {
            margin-right: 10px;
            width: 20px;
            height: 20px;
            filter: drop-shadow(1px 1px 1px rgba(0, 0, 0, 0.3));
        }
        footer iframe {

</head>
