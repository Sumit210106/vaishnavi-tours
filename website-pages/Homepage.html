<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/remixicon/4.2.0/remixicon.css" integrity="sha512-OQDNdI5rpnZ0BRhhJc+btbbtnxaj+LdQFeh0V9/igiEPDiWE2fG+ZsXl0JEH+bjXKPJ3zcXqNyP4/F/NegVdZg==" crossorigin="anonymous" referrerpolicy="no-referrer"/>
    <link rel="stylesheet" href="/homepage-css-files/style.css">
    <link rel="stylesheet" href="/homepage-css-files/swiper-bundle.min.css">

</head>
<body>
    <header class="header" id="header">

        <nav class="nav container">
            <a href="#" class="nav__logo">Vaishnavi Tours</a>
            <div class="nav__menu" id="nav-menu">
                <ul class="nav__list">
                    <li>
                        <a href="#" class="nav__link">Home</a>
                    </li>

                    <li>
                        <a href="#" class="nav__link">About Us</a>
                    </li>

                    <li>
                        <a href="#" class="nav__link">Services</a>
                    </li>

                    <li>
                        <a href="#" class="nav__link">Rates</a>
                    </li>
                    <li>
                        <a href="#" class="nav__link">Contact Us</a>
                    </li>
                </ul>
                <div class="nav__close" id="nav-close">
                    <i class="ri-close-large-line"></i>
                </div>
            </div>
            <div class="nav__toggle" id="nav-toggle">
                <i class="ri-menu-line"></i>
            </div>
        </nav>
    </header>

    <main class="main">
        <section class="home">
            <div class="home__swiper swiper">
                <div class="swiper-wrapper" >
                    <article class="home__article car__orange swiper-slide">
                        <div class="home__panel-1"></div>
                        <div class="home__panel-2"></div>

                        <div class="home__content container">
                            <div class="home__data">
                                <div class="home__titles">
                                    <h3 class="home__subtitle">Book</h3>
                                    <h1 class="home__title">TAXI</h1>
                                </div>
                                
                                <div class="home__img">
                                    <img src="innova.png" alt="" class="home__image">
                                </div>
                            </div>
                            <div class="home__info">
                                <div class="home__specs">
                                    <span>302 MPH</span>
                                    <span>0-100 KM/H</span>
                                    <span>360 KW</span>
                                </div>
                                <a href="tel:8169200792" class="home__button">
                                     <span>CALL NOW</span>
                                     <i class="ri-arrow-right-line"></i>
                                </a>
                            </div>
                        </div>
                    </article>
                    <article class="home__article car__green swiper-slide">
                        <div class="home__panel-1"></div>
                        <div class="home__panel-2"></div>

                        <div class="home__content container">
                            <div class="home__data">
                                <div class="home__titles">
                                    <h3 class="home__subtitle">Book</h3>
                                    <h1 class="home__title">TAXI</h1>
                                </div>
                                
                                <div class="home__img2">
                                    <img src="swift.png" alt="" class="home__image">
                                </div>
                            </div>
                            <div class="home__info">
                                <div class="home__specs">
                                    <span>370 MPH</span>
                                    <span>0-100 KM/H</span>
                                    <span>200 KW</span>
                                </div>
                                <a href="tel:8169200792" class="home__button">
                                     <span>CALL NOW</span>
                                     <i class="ri-arrow-right-line"></i>
                                </a>
                            </div>
                        </div>
                    </article>
                    <article class="home__article car__blue swiper-slide">
                        <div class="home__panel-1"></div>
                        <div class="home__panel-2"></div>

                        <div class="home__content container">
                            <div class="home__data">
                                <div class="home__titles">
                                    <h3 class="home__subtitle">Book</h3>
                                    <h1 class="home__title">TAXI</h1>
                                </div>
                                
                                <div class="home__img3">
                                    <img src="protonErtiga.png" alt="" class="home__image">
                                </div>
                            </div>
                            <div class="home__info">
                                <div class="home__specs">
                                    <span>302 MPH</span>
                                    <span>0-100 KM/H</span>
                                    <span>360 KW</span>
                                </div>
                                <a href="tel:8169200792" class="home__button">
                                     <span>CALL NOW</span>
                                     <i class="ri-arrow-right-line"></i>
                                    </a>
                                </div>
                            </div>
                        </article>
                        
                    </div>
                </div>
                <div class="home__interaction">
                    <div class="home__social">
                        <div class="home__social-border"></div>
                        
                        <a href="" target="_blank" class="home__social-link">
                            <i class="ri-twitter-x-line"></i>
                        </a>
                        
                        <a href="" target="_blank" class="home__social-link">
                            <i class="ri-instagram-line"></i>
                        </a>
                        
                        <a href="" target="_blank" class="home__social-link">
                            <i class="ri-facebook-circle-line"></i>
                        </a>
                    </div>
                    <div class="swiper-pagination"></div>
                </div>
                </section> 
            </main>
        </div>
    <script src="/hompages-js-files/gsap.min.js" ></script>
    <script src="/hompages-js-files/swiper-bundle.min.js"></script>
    <script src="/hompages-js-files/main.js"></script>
</body>
</html>
